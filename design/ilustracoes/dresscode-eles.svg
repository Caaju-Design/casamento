</defs>
<ellipse cx="560" cy="540" rx="370" ry="26" fill="#8a7d74" opacity=".22" filter="url(#rough)"/>
<g filter="url(#rough)">
  <use xlink:href="#shoe" transform="translate(-160 -80) scale(0.92)"/>
  <use xlink:href="#shoe" transform="translate(30 20)"/>
</g>
</svg>
