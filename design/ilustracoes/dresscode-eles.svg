    <path d="M568,374 C560,414 542,450 512,482" fill="none" stroke="#3e2112" stroke-width="2.6" stroke-dasharray="0.1 8" stroke-linecap="round"/>
    <path d="M292,300 C282,340 286,380 306,420" fill="none" stroke="#3e2112" stroke-width="2" opacity=".7"/>
