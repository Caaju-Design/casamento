      <path d="M546,370 C520,356 500,366 506,382 C512,396 534,390 546,370"/>
      <path d="M548,338 C526,318 500,322 500,338 C500,352 524,352 548,338"/>
      <path d="M546,370 C528,400 526,430 540,456"/>
      <path d="M546,370 C556,404 574,428 568,452"/>
    </g>
    <circle cx="540" cy="458" r="3" fill="#c9a06c"/><circle cx="568" cy="454" r="3" fill="#c9a06c"/>
