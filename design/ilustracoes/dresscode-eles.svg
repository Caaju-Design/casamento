<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 660" width="2000" height="1320">
<defs>
  <linearGradient id="leather" x1="0" y1="0" x2="0.25" y2="1">
    <stop offset="0" stop-color="#c98c5a"/><stop offset=".5" stop-color="#a0633a"/><stop offset="1" stop-color="#5e3218"/>
  </linearGradient>
  <radialGradient id="toeGlow" cx="0.86" cy="0.72" r="0.3">
