    </g>
    <!-- cadarço cruzado -->
    <g fill="none" stroke="#3a2419" stroke-width="5" stroke-linecap="round">
      <path d="M546,370 L584,332"/><path d="M548,338 L582,372"/>
      <path d="M582,372 L620,329"/><path d="M584,332 L618,369"/>
      <path d="M618,369 L656,331"/><path d="M620,329 L654,363"/>
    </g>
