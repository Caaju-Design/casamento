    <path d="M780,432 C818,418 858,428 880,452" fill="none" stroke="#fff3df" stroke-width="8" stroke-linecap="round" opacity=".7"/>
    <path d="M640,420 C690,432 730,440 760,444" fill="none" stroke="#fff3df" stroke-width="4" stroke-linecap="round" opacity=".45"/>
    <path d="M330,380 C390,396 440,408 480,414" fill="none" stroke="#fff3df" stroke-width="4" stroke-linecap="round" opacity=".4"/>
    <path d="M248,312 C244,340 250,372 264,396" fill="none" stroke="#fff3df" stroke-width="3.5" stroke-linecap="round" opacity=".5"/>
