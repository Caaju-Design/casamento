    <path d="M252,286 C228,318 232,392 270,424 C450,472 630,500 750,506 C860,512 904,472 874,430 C840,384 734,352 636,350 C522,326 370,276 270,280 C260,280 254,282 252,286 Z" fill="none" stroke="#2c170d" stroke-width="2.2" opacity=".8"/>
