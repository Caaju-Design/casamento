name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificação de tipo
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes unitários e de regressão
        run: npm test -- --run

      - name: Scanner de segredo no código e no histórico
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Vulnerabilidade conhecida em dependência
        run: npm audit --audit-level=high

      - name: Gate do Data Maping (checagem de campo no PR)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "$CHANGED_FILES" | grep -E "^(app/convite/|app/api/rsvp/|app/api/upload/|lib/google/|docs/security/data-mapping.md)" && \
            (echo "$PR_BODY" | grep -qiE "Impacto no Data Mapping: *(sim|não|nao)" || \
              (echo "PR toca caminho coberto pelo Data Mapping mas não preencheu o campo obrigatório no corpo do PR" && exit 1)) || \
            echo "Nenhum caminho coberto pelo Data Mapping foi alterado"
